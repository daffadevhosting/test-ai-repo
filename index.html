<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Register</title>
    <link rel="stylesheet" href="https://daffadevhosting.github.io/test-ai-repo/assets/css/style.css">
</head>
<body>
    <div class="container">
        <form id="loginForm" class="form">
            <h2>Login</h2>
            <input type="text" id="loginUsername" class="login-username" placeholder="Username" required>
            <input type="password" id="loginPassword" class="login-password" placeholder="Password" required>
            <button type="submit" onclick="handleLogin()">Login</button>
        </form>
        <form id="registerForm" class="form">
            <h2>Register</h2>
            <input type="text" id="registerUsername" class="register-username" placeholder="Username" required>
            <input type="email" id="registerEmail" class="register-email" placeholder="Email" required>
            <input type="password" id="registerPassword" class="register-password" placeholder="Password" required>
            <button type="submit" onclick="handleRegister()">Register</button>
        </form>
    </div>
    <script src="https://daffadevhosting.github.io/test-ai-repo/assets/js/app.js" defer></script>
</body>
</html>
