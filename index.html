<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Register</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .container {
            max-width: 600px; /* Adjusted to be wider */
            margin: 0 auto; /* Center the container */
            padding: 20px;
            box-sizing: border-box;
        }
        .form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .form h2 {
            margin-bottom: 20px;
        }
        .form input {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="loginForm" class="form">
            <h2>Login</h2>
            <input type="text" id="loginUsername" class="login-username" placeholder="Username" required>
            <input type="password" id="loginPassword" class="login-password" placeholder="Password" required>
            <button type="submit" onclick="handleLogin()">Login</button>
        </form>
        <form id="registerForm" class="form">
            <h2>Register</h2>
            <input type="text" id="registerUsername" class="register-username" placeholder="Username" required>
            <input type="email" id="registerEmail" class="register-email" placeholder="Email" required>
            <input type="password" id="registerPassword" class="register-password" placeholder="Password" required>
            <button type="submit" onclick="handleRegister()">Register</button>
        </form>
    </div>
    <script src="assets/js/app.js" defer></script>
</body>
</html>
